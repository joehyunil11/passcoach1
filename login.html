<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="js/boot.js"></script>
<title>로그인 · 공무원 AI</title>
<meta name="theme-color" content="#2563eb" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎓</text></svg>" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/shell.css" />
<link rel="stylesheet" href="css/auth.css" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'" />
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" /></noscript>
</head>
<body class="auth-page">
<a class="skip-link" href="#loginForm">로그인으로 건너뛰기</a>

<header class="topbar">
  <a class="topbar__home" href="index.html">
    <span class="topbar__dot" aria-hidden="true">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.4" /><path d="M5.5 19.5a6.5 6.5 0 0 1 13 0" /></svg>
    </span>
    공무원 AI
  </a>
  <div class="topbar__spacer"></div>
  <div class="topbar__auth">
    <a class="topbar__btn topbar__btn--ghost" href="login.html" aria-current="page">로그인</a>
    <a class="topbar__btn topbar__btn--primary" href="signup.html">회원가입</a>
  </div>
</header>

<main class="auth">
  <section class="auth__card auth__card--login" aria-labelledby="loginTitle">
    <div class="auth-sns">
      <h2 class="auth-sns__title">소셜 네트워크 로그인</h2>
      <p class="auth-sns__sub"><strong>소셜 네트워크</strong>를 통해 간편하게 로그인 하세요.</p>
      <div class="auth-sns__row">
        <a class="sns-btn sns-btn--kakao" href="/api/auth/kakao" aria-label="카카오 로그인">
          <img src="img/kakao-login.svg" alt="" width="56" height="56" />
        </a>
        <a class="sns-btn sns-btn--naver" href="/api/auth/naver" aria-label="네이버 로그인">
          <img src="img/naver-login.svg" alt="" width="56" height="56" />
        </a>
      </div>
    </div>

    <div class="auth-split" role="separator"></div>

    <h1 class="auth-regular__label" id="loginTitle">일반 로그인</h1>
    <p class="auth-regular__login">LOGIN</p>

    <form class="auth__form auth__form--boxed" id="loginForm" novalidate>
      <label class="sr-only" for="loginEmail">아이디</label>
      <input class="field" id="loginEmail" name="email" type="text" inputmode="email" autocomplete="username" required placeholder="아이디(이메일)" />

      <label class="sr-only" for="loginPassword">비밀번호</label>
      <input class="field" id="loginPassword" name="password" type="password" autocomplete="current-password" required minlength="6" placeholder="비밀번호" />

      <div class="auth-meta">
        <label class="auth-keep">
          <input type="checkbox" id="loginKeep" name="keep" />
          <span class="auth-keep__mark" aria-hidden="true"></span>
          로그인유지
        </label>
        <button class="auth-help" type="button" data-auth-help="true">도움말 <span aria-hidden="true">?</span></button>
      </div>

      <button class="auth-login-btn" type="submit">로그인</button>
    </form>

    <div class="auth-pills">
      <a class="auth-pill" href="signup.html">회원가입</a>
      <a class="auth-pill auth-pill--find" href="find-account.html">아이디/비밀번호 찾기</a>
    </div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="js/shell.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
