<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="js/boot.js"></script>
<script src="js/cloud.js?v=20260921"></script>
<title>비밀번호 재설정 · 공무원 AI</title>
<meta name="theme-color" content="#2563eb" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎓</text></svg>" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/shell.css" />
<link rel="stylesheet" href="css/auth.css" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'" />
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" /></noscript>
</head>
<body class="auth-page">
<a class="skip-link" href="#resetForm">비밀번호 재설정으로 건너뛰기</a>

<header class="topbar">
  <a class="topbar__home" href="index.html">
    <span class="topbar__dot" aria-hidden="true">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.4" /><path d="M5.5 19.5a6.5 6.5 0 0 1 13 0" /></svg>
    </span>
    공무원 AI
  </a>
  <div class="topbar__spacer"></div>
  <div class="topbar__auth">
    <a class="topbar__btn topbar__btn--ghost" href="login.html">로그인</a>
    <a class="topbar__btn topbar__btn--primary" href="signup.html">회원가입</a>
  </div>
</header>

<main class="auth">
  <section class="auth__card auth__card--login" aria-labelledby="resetTitle">
    <h1 class="auth-regular__label" id="resetTitle">비밀번호 재설정</h1>
    <p class="auth-regular__login">RESET</p>
    <p class="auth-find__lead" id="resetLead">메일에서 받은 링크로 들어온 뒤 새 비밀번호를 입력해 주세요.</p>

    <form class="auth__form auth__form--boxed" id="resetForm" novalidate>
      <label class="sr-only" for="resetPassword">새 비밀번호</label>
      <input class="field" id="resetPassword" name="password" type="password" autocomplete="new-password" required minlength="6" placeholder="새 비밀번호 (6자 이상)" />
      <label class="sr-only" for="resetPasswordAgain">새 비밀번호 확인</label>
      <input class="field" id="resetPasswordAgain" name="passwordAgain" type="password" autocomplete="new-password" required minlength="6" placeholder="새 비밀번호 확인" />
      <button class="auth-login-btn" type="submit">비밀번호 변경</button>
    </form>

    <div class="auth-pills">
      <a class="auth-pill" href="login.html">로그인</a>
      <a class="auth-pill auth-pill--find" href="find-account.html">아이디/비밀번호 찾기</a>
    </div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="js/shell.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
